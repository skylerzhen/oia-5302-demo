services:
  - type: web
    name: oia-5302-demo
    runtime: node
    buildCommand: npm install --omit=dev
    startCommand: node server/index.mjs
    healthCheckPath: /api/local-ai/status
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o
      - key: LLM_MODEL_FAST
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TTS_VOICE
        value: onyx
      - key: LIVEAVATAR_TTS_VOICE
        value: onyx
      - key: OPENAI_TTS_MODEL
        value: tts-1
      - key: HEYGEN_API_KEY
        sync: false
      - key: HEYGEN_AVATAR_ID
        sync: false
      - key: LIVEAVATAR_API_KEY
        sync: false
      - key: LIVEAVATAR_AVATAR_ID
        value: e9844e6d-847e-4964-a92b-7ecd066f69df
        sync: false
      - key: API_SECRET
        sync: false
      - key: LLM_GLOBAL_MAX_PER_HOUR
        value: "60"
