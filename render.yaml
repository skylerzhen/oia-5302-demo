services:
  - type: web
    name: oia-5302-demo
    runtime: node
    buildCommand: npm install --omit=dev
    startCommand: node server/index.mjs
    healthCheckPath: /api/local-ai/status
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o
      - key: LLM_MODEL_FAST
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TTS_VOICE
        value: shimmer
      - key: OPENAI_TTS_MODEL
        value: tts-1
